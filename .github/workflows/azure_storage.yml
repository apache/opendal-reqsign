      - name: Load Azure test configuration
        uses: 1Password/load-secrets-action@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          export-env: true
        env:
          REQSIGN_AZURE_STORAGE_URL: op://reqsign/azure-storage/url
          REQSIGN_AZURE_STORAGE_ACCOUNT_NAME: op://reqsign/azure-storage/account_name
          REQSIGN_AZURE_STORAGE_ACCOUNT_KEY: op://reqsign/azure-storage/account_key
          REQSIGN_AZURE_STORAGE_SAS_TOKEN: op://reqsign/azure-storage/sas_token
          AZURE_TENANT_ID: op://reqsign/azure-storage/tenant_id
          AZURE_CLIENT_ID: op://reqsign/azure-storage/client_id
      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Load bearer credential
        run: |
          bearer_token=$(az account get-access-token \
            --resource https://storage.azure.com/ \
            --query accessToken \
            --output tsv)
          test -n "$bearer_token"
          echo "::add-mask::$bearer_token"
          echo "REQSIGN_AZURE_STORAGE_BEARER_TOKEN=$bearer_token" >> "$GITHUB_ENV"
      - name: Test EnvCredentialProvider against Azure Blob Storage
        env:
          REQSIGN_AZURE_STORAGE_TEST_ENV: "on"
        run: |
          cargo test -p reqsign-azure-storage --test main credential_providers::env:: -- --no-capture

  test_client_secret_provider:
    needs: check_secrets
    if: needs.check_secrets.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure 1Password Connect
        uses: 1Password/load-secrets-action/configure@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          connect-host: ${{ secrets.OP_CONNECT_HOST }}
          connect-token: ${{ secrets.OP_CONNECT_TOKEN }}
      - name: Load Azure test configuration
        uses: 1Password/load-secrets-action@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          export-env: true
        env:
          REQSIGN_AZURE_STORAGE_URL: op://reqsign/azure-storage/url
          AZURE_TENANT_ID: op://reqsign/azure-storage/tenant_id
          AZURE_CLIENT_ID: op://reqsign/azure-storage/client_id
          AZURE_CLIENT_SECRET: op://reqsign/azure-storage/client_secret
      - name: Test ClientSecretCredentialProvider against Azure Blob Storage
        env:
          REQSIGN_AZURE_STORAGE_TEST_CLIENT_SECRET: "on"
        run: |
          cargo test -p reqsign-azure-storage --test main credential_providers::client_secret:: -- --no-capture

  test_client_certificate_provider:
    needs: check_secrets
    if: needs.check_secrets.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure 1Password Connect
        uses: 1Password/load-secrets-action/configure@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          connect-host: ${{ secrets.OP_CONNECT_HOST }}
          connect-token: ${{ secrets.OP_CONNECT_TOKEN }}
      - name: Load Azure test configuration
        uses: 1Password/load-secrets-action@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          export-env: true
        env:
          REQSIGN_AZURE_STORAGE_URL: op://reqsign/azure-storage/url
          AZURE_TENANT_ID: op://reqsign/azure-storage/tenant_id
          AZURE_CLIENT_ID: op://reqsign/azure-storage/client_id
          AZURE_CLIENT_CERTIFICATE_BASE64: op://reqsign/azure-storage/certificate_pem_base64
      - name: Set up client certificate
        run: |
          certificate_path="$RUNNER_TEMP/azure-client-certificate.pem"
          printf '%s' "$AZURE_CLIENT_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          test -s "$certificate_path"
          chmod 600 "$certificate_path"
          echo "AZURE_CLIENT_CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"
      - name: Test ClientCertificateCredentialProvider against Azure Blob Storage
        env:
          REQSIGN_AZURE_STORAGE_TEST_CLIENT_CERTIFICATE: "on"
        run: |
          cargo test -p reqsign-azure-storage --test main credential_providers::client_certificate:: -- --no-capture

  test_azure_cli_provider:
    needs: check_secrets
    if: needs.check_secrets.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure 1Password Connect
        uses: 1Password/load-secrets-action/configure@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          connect-host: ${{ secrets.OP_CONNECT_HOST }}
          connect-token: ${{ secrets.OP_CONNECT_TOKEN }}
      - name: Load Azure test configuration
        uses: 1Password/load-secrets-action@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          export-env: true
        env:
          REQSIGN_AZURE_STORAGE_URL: op://reqsign/azure-storage/url
          AZURE_TENANT_ID: op://reqsign/azure-storage/tenant_id
          AZURE_CLIENT_ID: op://reqsign/azure-storage/client_id
      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Test AzureCliCredentialProvider against Azure Blob Storage
        env:
          REQSIGN_AZURE_STORAGE_TEST_CLI: "on"
        run: |
          cargo test -p reqsign-azure-storage --test main credential_providers::azure_cli:: -- --no-capture

  test_workload_identity_provider:
    needs: check_secrets
    if: needs.check_secrets.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure 1Password Connect
        uses: 1Password/load-secrets-action/configure@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          connect-host: ${{ secrets.OP_CONNECT_HOST }}
          connect-token: ${{ secrets.OP_CONNECT_TOKEN }}
      - name: Load Azure test configuration
        uses: 1Password/load-secrets-action@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          export-env: true
        env:
          REQSIGN_AZURE_STORAGE_URL: op://reqsign/azure-storage/url
          AZURE_TENANT_ID: op://reqsign/azure-storage/tenant_id
          AZURE_CLIENT_ID: op://reqsign/azure-storage/client_id
      - name: Get GitHub workload identity token
        run: |
          token_file="$RUNNER_TEMP/azure-federated-token"
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2FAzureADTokenExchange"
          subject_token=$(curl --fail --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$request_url" | jq --raw-output '.value')
          test -n "$subject_token"
          echo "::add-mask::$subject_token"
          printf '%s' "$subject_token" > "$token_file"
          chmod 600 "$token_file"
          echo "AZURE_FEDERATED_TOKEN_FILE=$token_file" >> "$GITHUB_ENV"
      - name: Test WorkloadIdentityCredentialProvider against Azure Blob Storage
        env:
          REQSIGN_AZURE_STORAGE_TEST_WORKLOAD_IDENTITY: "on"
        run: |
          cargo test -p reqsign-azure-storage --test main credential_providers::workload_identity:: -- --no-capture

  test_default_provider:
    needs: check_secrets
    if: needs.check_secrets.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure 1Password Connect
        uses: 1Password/load-secrets-action/configure@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          connect-host: ${{ secrets.OP_CONNECT_HOST }}
          connect-token: ${{ secrets.OP_CONNECT_TOKEN }}
      - name: Load Azure test configuration
        uses: 1Password/load-secrets-action@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          export-env: true
        env:
          REQSIGN_AZURE_STORAGE_URL: op://reqsign/azure-storage/url
          AZURE_TENANT_ID: op://reqsign/azure-storage/tenant_id
          AZURE_CLIENT_ID: op://reqsign/azure-storage/client_id
      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Test DefaultCredentialProvider against Azure Blob Storage
        env:
          REQSIGN_AZURE_STORAGE_TEST_DEFAULT: "on"
        run: cargo test -p reqsign-azure-storage --test main credential_providers::default::test_default_provider -- --no-capture

  test_imds_provider:
    name: ImdsCredentialProvider live test
    needs: check_secrets
    if: needs.check_secrets.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure 1Password Connect
        uses: 1Password/load-secrets-action/configure@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          connect-host: ${{ secrets.OP_CONNECT_HOST }}
          connect-token: ${{ secrets.OP_CONNECT_TOKEN }}
      - name: Load Azure control-plane configuration
        uses: 1Password/load-secrets-action@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          export-env: true
        env:
          REQSIGN_AZURE_STORAGE_URL: op://reqsign/azure-storage/url
          AZURE_TENANT_ID: op://reqsign/azure-storage/tenant_id
          AZURE_CLIENT_ID: op://reqsign/azure-storage/client_id
      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Build IMDS live test binary
        id: build
        run: |
          messages="$RUNNER_TEMP/azure-imds-cargo-messages.json"
          cargo test -p reqsign-azure-storage --test main --no-run --message-format=json > "$messages"
          executable=$(jq --raw-output 'select(.profile.test == true and .target.name == "main") | .executable' "$messages" | tail -n 1)
          test -n "$executable"
          test -x "$executable"
          echo "executable=$executable" >> "$GITHUB_OUTPUT"
      - name: Upload IMDS live test binary
        id: artifact
        env:
          TEST_EXECUTABLE: ${{ steps.build.outputs.executable }}
        run: |
          artifact_name="ci-artifacts/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/azure-imds-live-test"
          az storage blob upload \
            --auth-mode login \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --container-name "$AZURE_STORAGE_CONTAINER" \
            --name "$artifact_name" \
            --file "$TEST_EXECUTABLE" \
            --overwrite \
            --only-show-errors
          echo "name=$artifact_name" >> "$GITHUB_OUTPUT"
      - name: Create private Azure VM
        id: vm
        run: |
          vm_name="reqsign-imds-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/azure-imds-vm-key"

          create_vm() {
            local location=$1
            local vnet=$2
            local size=$3
            az vm create \
              --resource-group "$AZURE_RUNTIME_RESOURCE_GROUP" \
              --name "$vm_name" \
              --location "$location" \
              --image Ubuntu2404 \
              --size "$size" \
              --admin-username azureuser \
              --ssh-key-values "$RUNNER_TEMP/azure-imds-vm-key.pub" \
              --assign-identity "$AZURE_IMDS_IDENTITY_ID" \
              --vnet-name "$vnet" \
              --subnet reqsign-ci-subnet \
              --nsg "" \
              --public-ip-address "" \
              --security-type Standard \
              --nic-delete-option Delete \
              --os-disk-delete-option Delete \
              --tags Project=reqsign Purpose=live-test GitHubRunId="$GITHUB_RUN_ID" \
              --only-show-errors \
              --output none
          }

          if create_vm eastus reqsign-ci-vnet Standard_B1s || \
             create_vm eastus reqsign-ci-vnet Standard_B2s || \
             create_vm eastus reqsign-ci-vnet Standard_D2s_v6 || \
             create_vm eastus2 reqsign-ci-vnet-eastus2 Standard_B1s || \
             create_vm eastus2 reqsign-ci-vnet-eastus2 Standard_B2s || \
             create_vm eastus2 reqsign-ci-vnet-eastus2 Standard_D2s_v6; then
            echo "name=$vm_name" >> "$GITHUB_OUTPUT"
          else
            echo "No configured Azure VM size had capacity" >&2
            exit 1
          fi
      - name: Test ImdsCredentialProvider on the Azure VM
        env:
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
          VM_NAME: ${{ steps.vm.outputs.name }}
        run: |
          artifact_url="https://${AZURE_STORAGE_ACCOUNT}.blob.core.windows.net/${AZURE_STORAGE_CONTAINER}/${ARTIFACT_NAME}"
          # shellcheck disable=SC2016
          remote_script='set -eu
          imds_response=$(curl --connect-timeout 15 --fail --silent --show-error --header "Metadata: true" "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fstorage.azure.com%2F&client_id='"$AZURE_IMDS_CLIENT_ID"'")
          storage_token=$(python3 -c '\''import json,sys; print(json.loads(sys.argv[1])["access_token"])'\'' "$imds_response")
          curl --connect-timeout 15 --fail --silent --show-error --header "Authorization: Bearer $storage_token" --header "x-ms-version: 2023-11-03" "'"$artifact_url"'" --output /tmp/reqsign-azure-imds-live-test
          chmod 700 /tmp/reqsign-azure-imds-live-test
          REQSIGN_AZURE_STORAGE_TEST_IMDS=on REQSIGN_AZURE_STORAGE_URL='"$REQSIGN_AZURE_STORAGE_URL"' AZURE_CLIENT_ID='"$AZURE_IMDS_CLIENT_ID"' /tmp/reqsign-azure-imds-live-test credential_providers::imds::test_imds_provider --exact
          echo REQSIGN_IMDS_TEST_SUCCEEDED'

          result=$(az vm run-command invoke \
            --resource-group "$AZURE_RUNTIME_RESOURCE_GROUP" \
            --name "$VM_NAME" \
            --command-id RunShellScript \
            --scripts "$remote_script" \
            --output json)
          if ! jq --exit-status '.value[0].message | contains("REQSIGN_IMDS_TEST_SUCCEEDED")' <<< "$result" >/dev/null; then
            jq --raw-output '.value[0].message' <<< "$result"
            exit 1
          fi
      - name: Delete ephemeral Azure resources
        if: always()
        env:
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
          VM_NAME: ${{ steps.vm.outputs.name }}
        run: |
          if [[ -n "$VM_NAME" ]] && az vm show --resource-group "$AZURE_RUNTIME_RESOURCE_GROUP" --name "$VM_NAME" >/dev/null 2>&1; then
            az vm delete \
              --resource-group "$AZURE_RUNTIME_RESOURCE_GROUP" \
              --name "$VM_NAME" \
              --yes \
              --force-deletion true \
              --only-show-errors
          fi
          if [[ -n "$ARTIFACT_NAME" ]]; then
            az storage blob delete \
              --auth-mode login \
              --account-name "$AZURE_STORAGE_ACCOUNT" \
              --container-name "$AZURE_STORAGE_CONTAINER" \
              --name "$ARTIFACT_NAME" \
              --only-show-errors
          fi

  test_azure_pipelines_provider:
    name: AzurePipelinesCredentialProvider live test
    needs: check_secrets
    if: needs.check_secrets.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure 1Password Connect
        uses: 1Password/load-secrets-action/configure@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          connect-host: ${{ secrets.OP_CONNECT_HOST }}
          connect-token: ${{ secrets.OP_CONNECT_TOKEN }}
      - name: Load Azure control-plane configuration
        uses: 1Password/load-secrets-action@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          export-env: true
        env:
          AZURE_TENANT_ID: op://reqsign/azure-storage/tenant_id
          AZURE_CLIENT_ID: op://reqsign/azure-storage/client_id
      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Queue Azure Pipelines provider test
        id: queue
        run: |
          access_token=$(az account get-access-token \
            --resource https://app.vssps.visualstudio.com/ \
            --query accessToken \
            --output tsv)
          test -n "$access_token"
          echo "::add-mask::$access_token"

          request_body=$(jq --null-input \
            --arg github_sha "$GITHUB_SHA" \
            --arg github_ref "$GITHUB_REF" \
            '{templateParameters: {githubSha: $github_sha, githubRef: $github_ref}}')
          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $access_token" \
            --header "Content-Type: application/json" \
            --data "$request_body" \
            "https://dev.azure.com/${AZURE_DEVOPS_ORGANIZATION}/${AZURE_DEVOPS_PROJECT}/_apis/pipelines/${AZURE_DEVOPS_PIPELINE_ID}/runs?api-version=7.1")

          run_id=$(jq --raw-output '.id // empty' <<< "$response")
          run_url=$(jq --raw-output '._links.web.href // empty' <<< "$response")
          test -n "$run_id"
          test -n "$run_url"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "Queued Azure Pipelines run: $run_url"
      - name: Wait for Azure Pipelines provider test
        env:
          RUN_ID: ${{ steps.queue.outputs.run_id }}
          RUN_URL: ${{ steps.queue.outputs.run_url }}
        run: |
          deadline=$((SECONDS + 3300))
          while (( SECONDS < deadline )); do
            access_token=$(az account get-access-token \
              --resource https://app.vssps.visualstudio.com/ \
              --query accessToken \
              --output tsv)
            response=$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $access_token" \
              "https://dev.azure.com/${AZURE_DEVOPS_ORGANIZATION}/${AZURE_DEVOPS_PROJECT}/_apis/pipelines/${AZURE_DEVOPS_PIPELINE_ID}/runs/${RUN_ID}?api-version=7.1")
            state=$(jq --raw-output '.state' <<< "$response")
            result=$(jq --raw-output '.result // empty' <<< "$response")
            if [[ "$state" == "completed" ]]; then
              echo "Azure Pipelines run completed with result '$result': $RUN_URL"
              test "$result" = "succeeded"
              exit
            fi
            sleep 15
          done
          echo "Azure Pipelines run did not complete before the timeout: $RUN_URL" >&2
          exit 1
      - name: Cancel unfinished Azure Pipelines run
        if: always() && steps.queue.outputs.run_id != ''
        env:
          RUN_ID: ${{ steps.queue.outputs.run_id }}
        run: |
          access_token=$(az account get-access-token \
            --resource https://app.vssps.visualstudio.com/ \
            --query accessToken \
            --output tsv)
          state=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $access_token" \
            "https://dev.azure.com/${AZURE_DEVOPS_ORGANIZATION}/${AZURE_DEVOPS_PROJECT}/_apis/pipelines/${AZURE_DEVOPS_PIPELINE_ID}/runs/${RUN_ID}?api-version=7.1" |
            jq --raw-output '.state')
          if [[ "$state" != "completed" ]]; then
            curl --fail-with-body --silent --show-error \
              --request PATCH \
              --header "Authorization: Bearer $access_token" \
              --header "Content-Type: application/json" \
              --data '{"status":"cancelling"}' \
              "https://dev.azure.com/${AZURE_DEVOPS_ORGANIZATION}/${AZURE_DEVOPS_PROJECT}/_apis/build/builds/${RUN_ID}?api-version=7.1" \
              >/dev/null
          fi

  signing_test:
    needs: check_secrets
    if: needs.check_secrets.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure 1Password Connect
        uses: 1Password/load-secrets-action/configure@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          connect-host: ${{ secrets.OP_CONNECT_HOST }}
          connect-token: ${{ secrets.OP_CONNECT_TOKEN }}
      - name: Load Azure signing configuration
        uses: 1Password/load-secrets-action@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          export-env: true
        env:
          REQSIGN_AZURE_STORAGE_URL: op://reqsign/azure-storage/url
          REQSIGN_AZURE_STORAGE_ACCOUNT_NAME: op://reqsign/azure-storage/account_name
          REQSIGN_AZURE_STORAGE_ACCOUNT_KEY: op://reqsign/azure-storage/account_key
          REQSIGN_AZURE_STORAGE_SAS_TOKEN: op://reqsign/azure-storage/sas_token
      - name: Test Azure Storage signing
        env:
          REQSIGN_AZURE_STORAGE_TEST: "on"
        run: |
          cargo test -p reqsign-azure-storage --test main signing:: -- --no-capture

  summary:
    name: Test Summary
    needs:
      - unit_test
      - check_secrets
      - test_static_provider
      - test_env_provider
      - test_client_secret_provider
      - test_client_certificate_provider
      - test_azure_cli_provider
      - test_workload_identity_provider
      - test_default_provider
      - test_imds_provider
      - test_azure_pipelines_provider
      - signing_test
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize Azure provider coverage
        env:
          UNIT_RESULT: ${{ needs.unit_test.result }}
          TRUSTED: ${{ needs.check_secrets.outputs.trusted }}
          STATIC_RESULT: ${{ needs.test_static_provider.result }}
          ENV_RESULT: ${{ needs.test_env_provider.result }}
          CLIENT_SECRET_RESULT: ${{ needs.test_client_secret_provider.result }}
          CLIENT_CERTIFICATE_RESULT: ${{ needs.test_client_certificate_provider.result }}
          AZURE_CLI_RESULT: ${{ needs.test_azure_cli_provider.result }}
          WORKLOAD_IDENTITY_RESULT: ${{ needs.test_workload_identity_provider.result }}
          DEFAULT_RESULT: ${{ needs.test_default_provider.result }}
          IMDS_RESULT: ${{ needs.test_imds_provider.result }}
          AZURE_PIPELINES_RESULT: ${{ needs.test_azure_pipelines_provider.result }}
          SIGNING_RESULT: ${{ needs.signing_test.result }}
        run: |
          {
            echo "## Azure Storage Test Summary"
            echo
            echo "| Coverage | Real Azure acceptance | Result |"
            echo "|----------|-----------------------|--------|"
            echo "| Unit tests and redacted real-response fixtures | Local | $UNIT_RESULT |"
            if [[ "$TRUSTED" == "true" ]]; then
              echo "| StaticCredentialProvider | Azure Blob Storage | $STATIC_RESULT |"
              echo "| EnvCredentialProvider | Azure Blob Storage | $ENV_RESULT |"
              echo "| ClientSecretCredentialProvider | Microsoft Entra ID and Azure Blob Storage | $CLIENT_SECRET_RESULT |"
              echo "| ClientCertificateCredentialProvider | Microsoft Entra ID and Azure Blob Storage | $CLIENT_CERTIFICATE_RESULT |"
              echo "| AzureCliCredentialProvider | Azure CLI and Azure Blob Storage | $AZURE_CLI_RESULT |"
              echo "| WorkloadIdentityCredentialProvider | GitHub OIDC, Microsoft Entra ID, and Azure Blob Storage | $WORKLOAD_IDENTITY_RESULT |"
              echo "| DefaultCredentialProvider | Azure CLI through the default chain and Azure Blob Storage | $DEFAULT_RESULT |"
              echo "| ImdsCredentialProvider | Ephemeral Azure VM IMDS and Azure Blob Storage | $IMDS_RESULT |"
              echo "| AzurePipelinesCredentialProvider | GitHub-queued Azure Pipelines service connection and Azure Blob Storage | $AZURE_PIPELINES_RESULT |"
              echo "| Azure Shared Key and SAS signing | Azure Blob Storage | $SIGNING_RESULT |"
            else
              echo "| Live service integration tests | Skipped for an untrusted change | skipped |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          test "$UNIT_RESULT" = "success"
          if [[ "$TRUSTED" == "true" ]]; then
            test "$STATIC_RESULT" = "success"
            test "$ENV_RESULT" = "success"
            test "$CLIENT_SECRET_RESULT" = "success"
            test "$CLIENT_CERTIFICATE_RESULT" = "success"
            test "$AZURE_CLI_RESULT" = "success"
            test "$WORKLOAD_IDENTITY_RESULT" = "success"
            test "$DEFAULT_RESULT" = "success"
            test "$IMDS_RESULT" = "success"
            test "$AZURE_PIPELINES_RESULT" = "success"
            test "$SIGNING_RESULT" = "success"
          fi
