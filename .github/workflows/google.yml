name: Google Cloud Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: "1"
  REQSIGN_GOOGLE_CLOUD_STORAGE_SCOPE: https://www.googleapis.com/auth/devstorage.read_only
  REQSIGN_GOOGLE_CLOUD_STORAGE_URL: https://storage.googleapis.com/storage/v1/b/reqsign
  REQSIGN_GOOGLE_CLOUD_STORAGE_PROBE_URL: https://storage.googleapis.com/storage/v1/b/reqsign/o/live%2Fcredential-ok?alt=media
  REQSIGN_GOOGLE_CLOUD_STORAGE_SIGNED_PROBE_URL: https://storage.googleapis.com/reqsign/live/credential-ok
  REQSIGN_GOOGLE_CAB_BUCKET: reqsign
  REQSIGN_GOOGLE_CAB_OBJECT_PREFIX: live/cab/allowed/
  REQSIGN_GOOGLE_IMPERSONATED_SERVICE_ACCOUNT: reqsign-impersonated@reqsign.iam.gserviceaccount.com

permissions: {}

jobs:
  unit_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run deterministic tests and redacted real-response replays
        run: |
          cargo test -p reqsign-google --lib --tests --all-features --no-fail-fast
          cargo test -p reqsign-google --doc --all-features --no-fail-fast

  check_secrets:
    runs-on: ubuntu-latest
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
    steps:
      - name: Check whether live credentials are available
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          HAS_CONNECT_HOST: ${{ secrets.OP_CONNECT_HOST != '' }}
          HAS_CONNECT_TOKEN: ${{ secrets.OP_CONNECT_TOKEN != '' }}
        run: |
          if [[ "$EVENT_NAME" == "push" || ( "$HAS_CONNECT_HOST" == "true" && "$HAS_CONNECT_TOKEN" == "true" ) ]]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "trusted=false" >> "$GITHUB_OUTPUT"
          fi

  prepare_live_resources:
    name: Prepare Google Cloud live probes
    needs: check_secrets
    if: needs.check_secrets.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure 1Password Connect
        uses: 1Password/load-secrets-action/configure@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          connect-host: ${{ secrets.OP_CONNECT_HOST }}
          connect-token: ${{ secrets.OP_CONNECT_TOKEN }}
      - name: Load workload identity configuration
        uses: 1Password/load-secrets-action@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          export-env: true
        env:
          GOOGLE_WORKLOAD_IDENTITY_PROVIDER: op://reqsign/google/workload_identity_provider
          GOOGLE_SERVICE_ACCOUNT: op://reqsign/google/service_account_email
      - name: Authenticate probe writer through workload identity
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          create_credentials_file: false
          token_format: access_token
          access_token_lifetime: 900s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          workload_identity_provider: ${{ env.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GOOGLE_SERVICE_ACCOUNT }}
      - name: Create and verify fixed Cloud Storage probes
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          for object in live%2Fcredential-ok live%2Fcab%2Fallowed%2Fcredential-ok; do
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" \
              --header "Content-Type: text/plain" \
              --data-binary $'reqsign-live-google-ok\n' \
              "https://storage.googleapis.com/upload/storage/v1/b/reqsign/o?uploadType=media&name=$object" \
              >/dev/null
          done

          test "$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" \
            "$REQSIGN_GOOGLE_CLOUD_STORAGE_PROBE_URL")" = "reqsign-live-google-ok"

  test_service_account_providers:
    name: Service account providers live test
    needs:
      - check_secrets
      - prepare_live_resources
    if: needs.check_secrets.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure 1Password Connect
        uses: 1Password/load-secrets-action/configure@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          connect-host: ${{ secrets.OP_CONNECT_HOST }}
          connect-token: ${{ secrets.OP_CONNECT_TOKEN }}
      - name: Load Google service-account credential
        id: load_secrets
        uses: 1Password/load-secrets-action@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        env:
          GOOGLE_CREDENTIAL_BASE64: op://reqsign/google/credential_base64
      - name: Set up service-account credential sources
        env:
          GOOGLE_CREDENTIAL_BASE64: ${{ steps.load_secrets.outputs.GOOGLE_CREDENTIAL_BASE64 }}
        run: |
          credential_path="$RUNNER_TEMP/google-service-account.json"
          printf '%s' "$GOOGLE_CREDENTIAL_BASE64" | base64 --decode > "$credential_path"
          test -s "$credential_path"
          chmod 600 "$credential_path"
          mkdir -p "$HOME/.config/gcloud"
          cp "$credential_path" "$HOME/.config/gcloud/application_default_credentials.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credential_path" >> "$GITHUB_ENV"
          echo "REQSIGN_GOOGLE_CREDENTIAL=$GOOGLE_CREDENTIAL_BASE64" >> "$GITHUB_ENV"
      - name: Test static, file, environment, well-known, and default providers
        env:
          REQSIGN_GOOGLE_TEST_STATIC: "on"
          REQSIGN_GOOGLE_TEST_FILE: "on"
          REQSIGN_GOOGLE_TEST_ENV: "on"
          REQSIGN_GOOGLE_TEST_WELL_KNOWN: "on"
          REQSIGN_GOOGLE_TEST_DEFAULT: "on"
        run: |
          cargo test -p reqsign-google --test main credential_providers::static_provider:: -- --no-capture
          cargo test -p reqsign-google --test main credential_providers::file::test_file_credential_provider_live -- --exact --no-capture
          cargo test -p reqsign-google --test main credential_providers::env:: -- --no-capture
          cargo test -p reqsign-google --test main credential_providers::default::test_default_credential_provider -- --exact --no-capture
      - name: Test ServiceAccountTokenCredentialProvider and server-side CAB
        env:
          REQSIGN_GOOGLE_TEST_SERVICE_ACCOUNT_TOKEN: "on"
        run: |
          cargo test -p reqsign-google --test service_account_token -- --no-capture
      - name: Test standard and service-account signed URL signing
        env:
          REQSIGN_GOOGLE_TEST: "on"
        run: |
          cargo test -p reqsign-google --test main signing:: -- --no-capture

  test_authorized_user_provider:
    name: Authorized user provider live test
    needs:
      - check_secrets
      - prepare_live_resources
    if: needs.check_secrets.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure 1Password Connect
        uses: 1Password/load-secrets-action/configure@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          connect-host: ${{ secrets.OP_CONNECT_HOST }}
          connect-token: ${{ secrets.OP_CONNECT_TOKEN }}
      - name: Load authorized-user credential
        id: load_secrets
        uses: 1Password/load-secrets-action@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        env:
          GOOGLE_AUTHORIZED_USER_BASE64: op://reqsign/google/authorized_user_base64
      - name: Set up authorized-user credential
        env:
          GOOGLE_AUTHORIZED_USER_BASE64: ${{ steps.load_secrets.outputs.GOOGLE_AUTHORIZED_USER_BASE64 }}
        run: |
          credential_path="$RUNNER_TEMP/google-authorized-user.json"
          printf '%s' "$GOOGLE_AUTHORIZED_USER_BASE64" | base64 --decode > "$credential_path"
          test -s "$credential_path"
          chmod 600 "$credential_path"
          echo "REQSIGN_GOOGLE_AUTHORIZED_USER_CREDENTIALS=$credential_path" >> "$GITHUB_ENV"
      - name: Test AuthorizedUserCredentialProvider against Cloud Storage
        env:
          REQSIGN_GOOGLE_TEST_AUTHORIZED_USER: "on"
        run: |
          cargo test -p reqsign-google --test main credential_providers::authorized_user::test_authorized_user_credential_provider -- --exact --no-capture

  test_workload_identity_and_token_providers:
    name: Workload identity, token, CAB, and IAM Credentials live test
    needs:
      - check_secrets
      - prepare_live_resources
    if: needs.check_secrets.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure 1Password Connect
        uses: 1Password/load-secrets-action/configure@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          connect-host: ${{ secrets.OP_CONNECT_HOST }}
          connect-token: ${{ secrets.OP_CONNECT_TOKEN }}
      - name: Load workload identity configuration
        uses: 1Password/load-secrets-action@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          export-env: true
        env:
          GOOGLE_WORKLOAD_IDENTITY_PROVIDER: op://reqsign/google/workload_identity_provider
          GOOGLE_SERVICE_ACCOUNT: op://reqsign/google/service_account_email
      - name: Load caller-bound GitHub OIDC subject token
        run: |
          audience="//iam.googleapis.com/${GOOGLE_WORKLOAD_IDENTITY_PROVIDER}"
          encoded_audience=$(jq --null-input --raw-output --arg value "$audience" '$value | @uri')
          subject_token=$(curl --fail-with-body --silent --show-error --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}" |
            jq --exit-status --raw-output '.value')
          test -n "$subject_token"
          echo "::add-mask::$subject_token"
          echo "REQSIGN_GOOGLE_SUBJECT_TOKEN=$subject_token" >> "$GITHUB_ENV"
          echo "REQSIGN_GOOGLE_WORKLOAD_IDENTITY_AUDIENCE=$audience" >> "$GITHUB_ENV"
      - name: Authenticate to Google Cloud through workload identity
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          create_credentials_file: true
          token_format: access_token
          access_token_lifetime: 3600s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          workload_identity_provider: ${{ env.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GOOGLE_SERVICE_ACCOUNT }}
      - name: Test Workload Identity and caller-provided subject tokens
        env:
          REQSIGN_GOOGLE_TEST_WORKLOAD_IDENTITY: "on"
          REQSIGN_GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          cargo test -p reqsign-google --test main credential_providers::external_account:: -- --no-capture
      - name: Test TokenCredentialProvider
        env:
          REQSIGN_GOOGLE_TEST_TOKEN: "on"
          REQSIGN_GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          cargo test -p reqsign-google --test main credential_providers::token::test_token_credential_provider_live -- --exact --no-capture
      - name: Test typed service-account impersonation and IAM signBlob
        env:
          REQSIGN_GOOGLE_TEST_SERVICE_ACCOUNT_IMPERSONATION: "on"
          REQSIGN_GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          cargo test -p reqsign-google --test main credential_providers::service_account_impersonation:: -- --no-capture
      - name: Test client-side Credential Access Boundary
        env:
          REQSIGN_GOOGLE_TEST_CAB: "on"
          REQSIGN_GOOGLE_CAB_SOURCE_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          export REQSIGN_GOOGLE_CAB_SOURCE_EXPIRES_AT
          REQSIGN_GOOGLE_CAB_SOURCE_EXPIRES_AT=$(date --utc --date='+50 minutes' '+%Y-%m-%dT%H:%M:%SZ')
          cargo test -p reqsign-google --features credential-access-boundary-client-side --test credential_access_boundary -- --no-capture

  test_impersonated_adc_provider:
    name: Impersonated ADC provider live test
    needs:
      - check_secrets
      - prepare_live_resources
    if: needs.check_secrets.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure 1Password Connect
        uses: 1Password/load-secrets-action/configure@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          connect-host: ${{ secrets.OP_CONNECT_HOST }}
          connect-token: ${{ secrets.OP_CONNECT_TOKEN }}
      - name: Load impersonated ADC credential
        id: load_secrets
        uses: 1Password/load-secrets-action@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        env:
          GOOGLE_IMPERSONATED_ADC_BASE64: op://reqsign/google/impersonated_sa_base64
      - name: Set up impersonated ADC credential
        env:
          GOOGLE_IMPERSONATED_ADC_BASE64: ${{ steps.load_secrets.outputs.GOOGLE_IMPERSONATED_ADC_BASE64 }}
        run: |
          credential_path="$RUNNER_TEMP/google-impersonated-adc.json"
          printf '%s' "$GOOGLE_IMPERSONATED_ADC_BASE64" | base64 --decode > "$credential_path"
          test -s "$credential_path"
          chmod 600 "$credential_path"
          echo "REQSIGN_GOOGLE_IMPERSONATED_SERVICE_ACCOUNT_CREDENTIALS=$credential_path" >> "$GITHUB_ENV"
      - name: Test ImpersonatedServiceAccountCredentialProvider against Cloud Storage
        env:
          REQSIGN_GOOGLE_TEST_IMPERSONATED_SERVICE_ACCOUNT: "on"
        run: |
          cargo test -p reqsign-google --test main credential_providers::impersonated_service_account::test_impersonated_service_account_credential_provider -- --exact --no-capture

  test_vm_metadata_provider:
    name: VM metadata provider live test
    needs:
      - check_secrets
      - prepare_live_resources
    if: needs.check_secrets.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_PROJECT_ID: reqsign
      GOOGLE_METADATA_SERVICE_ACCOUNT: reqsign-metadata@reqsign.iam.gserviceaccount.com
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure 1Password Connect
        uses: 1Password/load-secrets-action/configure@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          connect-host: ${{ secrets.OP_CONNECT_HOST }}
          connect-token: ${{ secrets.OP_CONNECT_TOKEN }}
      - name: Load Google control-plane configuration
        uses: 1Password/load-secrets-action@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          export-env: true
        env:
          GOOGLE_WORKLOAD_IDENTITY_PROVIDER: op://reqsign/google/workload_identity_provider
          GOOGLE_SERVICE_ACCOUNT: op://reqsign/google/service_account_email
      - name: Authenticate Google control plane through workload identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          create_credentials_file: true
          workload_identity_provider: ${{ env.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GOOGLE_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.GOOGLE_PROJECT_ID }}
      - name: Build VM metadata live test binary
        id: build
        run: |
          messages="$RUNNER_TEMP/google-metadata-cargo-messages.json"
          cargo test -p reqsign-google --test main --no-run --message-format=json > "$messages"
          executable=$(jq --raw-output 'select(.profile.test == true and .target.name == "main") | .executable' "$messages" | tail -n 1)
          test -n "$executable"
          test -x "$executable"
          echo "executable=$executable" >> "$GITHUB_OUTPUT"
      - name: Upload VM metadata live test binary
        id: artifact
        env:
          TEST_EXECUTABLE: ${{ steps.build.outputs.executable }}
        run: |
          artifact_name="ci-artifact-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud storage cp "$TEST_EXECUTABLE" "gs://reqsign/$artifact_name" --quiet
          echo "name=$artifact_name" >> "$GITHUB_OUTPUT"
      - name: Create private Compute Engine VM
        id: vm
        env:
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
        run: |
          vm_name="reqsign-metadata-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          startup_script="$RUNNER_TEMP/google-metadata-startup.sh"
          cat > "$startup_script" <<SCRIPT
          #!/usr/bin/env bash
          set -euo pipefail
          exec > >(tee /dev/ttyS0) 2>&1
          token_response=\$(curl --connect-timeout 15 --fail --silent --show-error \
            --header 'Metadata-Flavor: Google' \
            'http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token?scopes=https://www.googleapis.com/auth/cloud-platform')
          storage_token=\$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["access_token"])' "\$token_response")
          curl --connect-timeout 15 --fail --silent --show-error \
            --header "Authorization: Bearer \$storage_token" \
            "https://storage.googleapis.com/storage/v1/b/reqsign/o/${ARTIFACT_NAME}?alt=media" \
            --output /tmp/reqsign-google-metadata-live-test
          chmod 700 /tmp/reqsign-google-metadata-live-test
          REQSIGN_GOOGLE_TEST_VM_METADATA=on \
          REQSIGN_GOOGLE_CLOUD_STORAGE_SCOPE='https://www.googleapis.com/auth/devstorage.read_only' \
          REQSIGN_GOOGLE_CLOUD_STORAGE_PROBE_URL='https://storage.googleapis.com/storage/v1/b/reqsign/o/live%2Fcredential-ok?alt=media' \
            /tmp/reqsign-google-metadata-live-test credential_providers::vm_metadata:: --nocapture
          echo REQSIGN_GOOGLE_METADATA_TEST_SUCCEEDED
          SCRIPT

          for zone in us-east1-b us-east1-c us-east1-d; do
            if gcloud compute instances create "$vm_name" --project="$GOOGLE_PROJECT_ID" --zone="$zone" --machine-type=e2-micro --subnet=default --no-address --image-family=ubuntu-2404-lts-amd64 --image-project=ubuntu-os-cloud --service-account="$GOOGLE_METADATA_SERVICE_ACCOUNT" --scopes=https://www.googleapis.com/auth/cloud-platform --metadata-from-file=startup-script="$startup_script" --max-run-duration=15m --instance-termination-action=DELETE --boot-disk-auto-delete --labels=project=reqsign,purpose=live-test,github-run-id="$GITHUB_RUN_ID" --quiet; then
              echo "name=$vm_name" >> "$GITHUB_OUTPUT"
              echo "zone=$zone" >> "$GITHUB_OUTPUT"
              exit
            fi
          done
          echo "No configured Compute Engine zone had capacity" >&2
          exit 1
      - name: Wait for VM metadata live test
        env:
          VM_NAME: ${{ steps.vm.outputs.name }}
          VM_ZONE: ${{ steps.vm.outputs.zone }}
        run: |
          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            output=$(gcloud compute instances get-serial-port-output "$VM_NAME" --zone="$VM_ZONE" --port=1 --start=0 2>/dev/null || true)
            if grep --quiet REQSIGN_GOOGLE_METADATA_TEST_SUCCEEDED <<< "$output"; then
              exit
            fi
            if grep --quiet 'FAILED' <<< "$output"; then
              printf '%s\n' "$output"
              exit 1
            fi
            sleep 10
          done
          gcloud compute instances get-serial-port-output "$VM_NAME" --zone="$VM_ZONE" --port=1 --start=0 || true
          echo "VM metadata live test did not finish before the timeout" >&2
          exit 1
      - name: Delete ephemeral Google resources
        if: always()
        env:
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
          VM_NAME: ${{ steps.vm.outputs.name }}
          VM_ZONE: ${{ steps.vm.outputs.zone }}
        run: |
          if [[ -n "$VM_NAME" ]] && [[ -n "$VM_ZONE" ]] && gcloud compute instances describe "$VM_NAME" --zone="$VM_ZONE" >/dev/null 2>&1; then
            gcloud compute instances delete "$VM_NAME" --zone="$VM_ZONE" --quiet
          fi
          if [[ -n "$ARTIFACT_NAME" ]]; then
            gcloud storage rm "gs://reqsign/$ARTIFACT_NAME" --quiet
          fi

  summary:
    name: Test Summary
    needs:
      - unit_test
      - check_secrets
      - prepare_live_resources
      - test_service_account_providers
      - test_authorized_user_provider
      - test_workload_identity_and_token_providers
      - test_impersonated_adc_provider
      - test_vm_metadata_provider
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize Google credential coverage
        env:
          UNIT_RESULT: ${{ needs.unit_test.result }}
          TRUSTED: ${{ needs.check_secrets.outputs.trusted }}
          PREPARE_RESULT: ${{ needs.prepare_live_resources.result }}
          SERVICE_ACCOUNT_RESULT: ${{ needs.test_service_account_providers.result }}
          AUTHORIZED_USER_RESULT: ${{ needs.test_authorized_user_provider.result }}
          WORKLOAD_IDENTITY_RESULT: ${{ needs.test_workload_identity_and_token_providers.result }}
          IMPERSONATED_ADC_RESULT: ${{ needs.test_impersonated_adc_provider.result }}
          VM_METADATA_RESULT: ${{ needs.test_vm_metadata_provider.result }}
        run: |
          {
            echo "## Google Cloud Test Summary"
            echo
            echo "| Coverage | Real service acceptance | Result |"
            echo "|----------|-------------------------|--------|"
            echo "| Unit tests and redacted real-response replays | Local | $UNIT_RESULT |"
            if [[ "$TRUSTED" == "true" ]]; then
              echo "| Fixed Cloud Storage probes | Workload Identity and Cloud Storage | $PREPARE_RESULT |"
              echo "| Static, file, environment, well-known, and default providers | OAuth and Cloud Storage | $SERVICE_ACCOUNT_RESULT |"
              echo "| ServiceAccountTokenCredentialProvider and server-side CAB | OAuth, STS, and Cloud Storage | $SERVICE_ACCOUNT_RESULT |"
              echo "| Authorized user provider | OAuth and Cloud Storage | $AUTHORIZED_USER_RESULT |"
              echo "| External account and TokenCredentialProvider | GitHub OIDC, STS, IAM Credentials, and Cloud Storage | $WORKLOAD_IDENTITY_RESULT |"
              echo "| Typed impersonation, IAM signBlob, and client-side CAB | IAM Credentials, STS, and Cloud Storage | $WORKLOAD_IDENTITY_RESULT |"
              echo "| Impersonated ADC provider | OAuth, IAM Credentials, and Cloud Storage | $IMPERSONATED_ADC_RESULT |"
              echo "| VmMetadataCredentialProvider | Compute Engine metadata and Cloud Storage | $VM_METADATA_RESULT |"
            else
              echo "| Live service integration tests | Skipped because Connect secrets are unavailable | skipped |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          test "$UNIT_RESULT" = "success"
          if [[ "$TRUSTED" == "true" ]]; then
            test "$PREPARE_RESULT" = "success"
            test "$SERVICE_ACCOUNT_RESULT" = "success"
            test "$AUTHORIZED_USER_RESULT" = "success"
            test "$WORKLOAD_IDENTITY_RESULT" = "success"
            test "$IMPERSONATED_ADC_RESULT" = "success"
            test "$VM_METADATA_RESULT" = "success"
          fi
