        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            core.setSecret(token);
            require('fs').writeFileSync('/tmp/reqsign-aws-role-token', token, { mode: 0o600 });
      - name: Assume the reqsign live-test role
        env:
          ROLE_ARN: ${{ vars.REQSIGN_AWS_LIVE_ROLE_ARN }}
          ROLE_SESSION_NAME: reqsign-imds-${{ github.run_id }}
        shell: bash
        run: |
          credentials="$(aws sts assume-role-with-web-identity \
            --role-arn "$ROLE_ARN" \
            --role-session-name "$ROLE_SESSION_NAME" \
            --web-identity-token "$(tr -d '\n' < /tmp/reqsign-aws-role-token)" \
            --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
            --output text)"
          read -r access_key secret_key session_token <<< "$credentials"
          test -n "$access_key" && test -n "$secret_key" && test -n "$session_token"
          echo "::add-mask::$access_key"
          echo "::add-mask::$secret_key"
          echo "::add-mask::$session_token"
          {
            echo "AWS_ACCESS_KEY_ID=$access_key"
            echo "AWS_SECRET_ACCESS_KEY=$secret_key"
            echo "AWS_SESSION_TOKEN=$session_token"
          } >> "$GITHUB_ENV"
      - name: Launch the ephemeral IMDSv2 test instance
        env:
          IMAGE_URI: ${{ needs.build_live_image.outputs.image }}
          INSTANCE_PROFILE: ${{ vars.REQSIGN_AWS_LIVE_EC2_INSTANCE_PROFILE }}
          SUBNET_ID: ${{ vars.REQSIGN_AWS_LIVE_SUBNET_ID }}
          SECURITY_GROUP_ID: ${{ vars.REQSIGN_AWS_LIVE_SECURITY_GROUP_ID }}
          RESULT_BUCKET: ${{ vars.REQSIGN_AWS_LIVE_TEST_BUCKET }}
        shell: bash
        run: |
          result_key="live-tests/results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/imds.log"
          echo "IMDS_RESULT_KEY=$result_key" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/reqsign-imds-user-data.sh" <<EOF
          #!/bin/bash
          log_file=/var/log/reqsign-live-test.log
          (
            set -euo pipefail
            dnf install --assumeyes docker
            systemctl enable --now docker
            aws ecr get-login-password --region '${AWS_REGION}' | docker login --username AWS --password-stdin '${IMAGE_URI%/*}'
            docker run --rm --network host \
              --env AWS_REGION='${AWS_REGION}' \
              --env REQSIGN_AWS_V4_TEST_IMDS=on \
              --env REQSIGN_AWS_V4_VALIDATE_CREDENTIALS=on \
              --env RUST_LOG=info \
              '${IMAGE_URI}' test_imds_v2_credential_provider --nocapture
          ) > "\$log_file" 2>&1
          test_status=\$?
          printf '\nREQSIGN_TEST_EXIT_CODE=%s\n' "\$test_status" >> "\$log_file"
          aws s3 cp "\$log_file" 's3://${RESULT_BUCKET}/${result_key}' --region '${AWS_REGION}'
          shutdown -h now
          EOF
          chmod 700 "$RUNNER_TEMP/reqsign-imds-user-data.sh"

          ami_id="$(aws ssm get-parameter \
            --name /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64 \
            --query 'Parameter.Value' \
            --output text)"
          expires_at="$(date -u -d '+2 hours' '+%Y-%m-%dT%H:%M:%SZ')"
          instance_id="$(aws ec2 run-instances \
            --image-id "$ami_id" \
            --instance-type t3.nano \
            --count 1 \
            --iam-instance-profile "Name=$INSTANCE_PROFILE" \
            --subnet-id "$SUBNET_ID" \
            --security-group-ids "$SECURITY_GROUP_ID" \
            --associate-public-ip-address \
            --metadata-options 'HttpEndpoint=enabled,HttpTokens=required,HttpPutResponseHopLimit=2,InstanceMetadataTags=disabled' \
            --instance-initiated-shutdown-behavior terminate \
            --user-data "file://$RUNNER_TEMP/reqsign-imds-user-data.sh" \
            --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=reqsign-live-test-imds},{Key=Project,Value=reqsign},{Key=Purpose,Value=live-test},{Key=GitHubRunId,Value=${GITHUB_RUN_ID}},{Key=ExpiresAt,Value=$expires_at}]" \
            --query 'Instances[0].InstanceId' \
            --output text)"
          echo "INSTANCE_ID=$instance_id" >> "$GITHUB_ENV"

          result_found=false
          for _ in {1..120}; do
            if aws s3api head-object --bucket "$RESULT_BUCKET" --key "$result_key" >/dev/null 2>&1; then
              result_found=true
              break
            fi
            sleep 10
          done
          test "$result_found" = "true"
          aws s3 cp "s3://$RESULT_BUCKET/$result_key" "$RUNNER_TEMP/reqsign-imds-result.log"
          sed -E 's/(AccessKeyId|SecretAccessKey|Token).*/\1: [REDACTED]/I' "$RUNNER_TEMP/reqsign-imds-result.log"
          grep -qx 'REQSIGN_TEST_EXIT_CODE=0' "$RUNNER_TEMP/reqsign-imds-result.log"
      - name: Clean up the IMDSv2 test instance
        if: always()
        env:
          RESULT_BUCKET: ${{ vars.REQSIGN_AWS_LIVE_TEST_BUCKET }}
        shell: bash
        run: |
          if [[ -n "${INSTANCE_ID:-}" ]]; then
            aws ec2 terminate-instances --instance-ids "$INSTANCE_ID" >/dev/null 2>&1 || true
          fi
          if [[ -n "${IMDS_RESULT_KEY:-}" ]]; then
            aws s3api delete-object --bucket "$RESULT_BUCKET" --key "$IMDS_RESULT_KEY" >/dev/null 2>&1 || true
          fi


  # Summary report
  summary:
    if: always()
    needs:
      - unit_test
      - check_secrets
      - signing_test
      - test_env_provider
      - test_profile_provider
      - test_assume_role_provider
      - test_web_identity_provider
      - test_imds_provider
      - test_ecs_provider
      - test_sso_provider
      - test_process_provider
      - test_cognito_provider
      - test_s3_express_provider
      - test_live_hosted_providers
      - build_live_image
      - test_live_ecs_provider
      - test_live_imds_provider
    runs-on: ubuntu-latest
    steps:
      - name: Test Summary
        run: |
          echo "## AWS V4 Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "#### Core Tests" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${NEEDS_UNIT_TEST_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "#### Integration Tests (with real AWS credentials)" >> $GITHUB_STEP_SUMMARY
          if [[ "${NEEDS_CHECK_SECRETS_OUTPUTS_HAS_SECRETS}" == "true" ]]; then
            echo "✅ **Integration tests with real AWS credentials were executed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Test | Result |" >> $GITHUB_STEP_SUMMARY
            echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| Signing Tests | ${NEEDS_SIGNING_TEST_RESULT} |" >> $GITHUB_STEP_SUMMARY
            echo "| EnvCredentialProvider | ${NEEDS_TEST_ENV_PROVIDER_RESULT} |" >> $GITHUB_STEP_SUMMARY
            echo "| ProfileCredentialProvider | ${NEEDS_TEST_PROFILE_PROVIDER_RESULT} |" >> $GITHUB_STEP_SUMMARY
            echo "| AssumeRoleCredentialProvider | ${NEEDS_TEST_ASSUME_ROLE_PROVIDER_RESULT} |" >> $GITHUB_STEP_SUMMARY
            echo "| AssumeRoleWithWebIdentityCredentialProvider | ${NEEDS_TEST_WEB_IDENTITY_PROVIDER_RESULT} |" >> $GITHUB_STEP_SUMMARY
            echo "| S3ExpressSessionProvider | ${NEEDS_TEST_S3_EXPRESS_PROVIDER_RESULT} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Integration tests were skipped** (forked repository or no secrets available)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "#### Real Service Tests (GitHub OIDC)" >> $GITHUB_STEP_SUMMARY
          if [[ "${NEEDS_CHECK_SECRETS_OUTPUTS_HAS_SECRETS}" == "true" ]]; then
            echo "| Coverage | Result |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| Hosted credential providers and S3 signing | ${NEEDS_TEST_LIVE_HOSTED_PROVIDERS_RESULT} |" >> $GITHUB_STEP_SUMMARY
            echo "| Docker image build and ECR push | ${NEEDS_BUILD_LIVE_IMAGE_RESULT} |" >> $GITHUB_STEP_SUMMARY
            echo "| ECS task credentials on Fargate | ${NEEDS_TEST_LIVE_ECS_PROVIDER_RESULT} |" >> $GITHUB_STEP_SUMMARY
            echo "| IMDSv2 credentials on ephemeral EC2 | ${NEEDS_TEST_LIVE_IMDS_PROVIDER_RESULT} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "SSOCredentialProvider remains mock-only because it requires a pre-authorized legacy SSO cache and has no unattended token refresh flow." >> $GITHUB_STEP_SUMMARY
          else
            echo "Real service tests were skipped for this untrusted change." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "#### Mock Server Tests" >> $GITHUB_STEP_SUMMARY
          echo "The following providers are tested using mock servers:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Provider | Mock Server | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| IMDSv2CredentialProvider | amazon-ec2-metadata-mock | ${NEEDS_TEST_IMDS_PROVIDER_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| ECSCredentialProvider | Python mock (port 51679) | ${NEEDS_TEST_ECS_PROVIDER_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| SSOCredentialProvider | Python mock (port 8080) | ${NEEDS_TEST_SSO_PROVIDER_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| ProcessCredentialProvider | Python credential helper | ${NEEDS_TEST_PROCESS_PROVIDER_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| CognitoIdentityCredentialProvider | Python mock (port 8443) | ${NEEDS_TEST_COGNITO_PROVIDER_RESULT} |" >> $GITHUB_STEP_SUMMARY

        env:
          NEEDS_UNIT_TEST_RESULT: ${{ needs.unit_test.result }}

          NEEDS_CHECK_SECRETS_OUTPUTS_HAS_SECRETS: ${{ needs.check_secrets.outputs.has_secrets }}

          NEEDS_SIGNING_TEST_RESULT: ${{ needs.signing_test.result }}

          NEEDS_TEST_ENV_PROVIDER_RESULT: ${{ needs.test_env_provider.result }}

          NEEDS_TEST_PROFILE_PROVIDER_RESULT: ${{ needs.test_profile_provider.result }}

          NEEDS_TEST_ASSUME_ROLE_PROVIDER_RESULT: ${{ needs.test_assume_role_provider.result }}

          NEEDS_TEST_WEB_IDENTITY_PROVIDER_RESULT: ${{ needs.test_web_identity_provider.result }}

          NEEDS_TEST_S3_EXPRESS_PROVIDER_RESULT: ${{ needs.test_s3_express_provider.result }}

          NEEDS_TEST_IMDS_PROVIDER_RESULT: ${{ needs.test_imds_provider.result }}

          NEEDS_TEST_ECS_PROVIDER_RESULT: ${{ needs.test_ecs_provider.result }}

          NEEDS_TEST_SSO_PROVIDER_RESULT: ${{ needs.test_sso_provider.result }}

          NEEDS_TEST_PROCESS_PROVIDER_RESULT: ${{ needs.test_process_provider.result }}

          NEEDS_TEST_COGNITO_PROVIDER_RESULT: ${{ needs.test_cognito_provider.result }}

          NEEDS_TEST_LIVE_HOSTED_PROVIDERS_RESULT: ${{ needs.test_live_hosted_providers.result }}

          NEEDS_BUILD_LIVE_IMAGE_RESULT: ${{ needs.build_live_image.result }}

          NEEDS_TEST_LIVE_ECS_PROVIDER_RESULT: ${{ needs.test_live_ecs_provider.result }}

          NEEDS_TEST_LIVE_IMDS_PROVIDER_RESULT: ${{ needs.test_live_imds_provider.result }}
