trigger: none
pr: none

schedules:
  - cron: "0 3 * * 1"
    displayName: Weekly Azure Pipelines credential test
    branches:
      include:
        - main
    always: true

pool:
  name: reqsign-azure-vmss

steps:
  - checkout: self
    persistCredentials: false

  - bash: |
      if git fetch --depth=1 https://github.com/apache/opendal-reqsign.git main; then
        if git cat-file -e FETCH_HEAD:azure-pipelines.yml 2>/dev/null; then
          git checkout --detach FETCH_HEAD
        fi
      fi
    displayName: Use canonical main after Azure Pipelines is configured

  - bash: |
      sudo apt-get update
      sudo apt-get install --yes build-essential pkg-config libssl-dev
      if ! command -v az >/dev/null; then
        curl --fail --silent --show-error --location https://aka.ms/InstallAzureCLIDeb | sudo bash
      fi
      if ! command -v cargo >/dev/null; then
        curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs |
          sh -s -- -y --profile minimal
        echo "##vso[task.prependpath]$HOME/.cargo/bin"
      fi
    displayName: Install Azure CLI and Rust

  - task: AzureCLI@2
    displayName: Test AzurePipelinesCredentialProvider against Azure Blob Storage
    inputs:
      azureSubscription: reqsign-azure-wif
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        test -n "$AZURESUBSCRIPTION_CLIENT_ID"
        test -n "$AZURESUBSCRIPTION_TENANT_ID"
        test -n "$AZURESUBSCRIPTION_SERVICE_CONNECTION_ID"
        test -n "$SYSTEM_ACCESSTOKEN"
        export REQSIGN_AZURE_STORAGE_TEST_PIPELINES=on
        test "$REQSIGN_AZURE_STORAGE_TEST_PIPELINES" = "on"
        cargo test -p reqsign-azure-storage --test main \
          credential_providers::azure_pipelines::test_azure_pipelines_provider \
          -- --exact --no-capture
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      REQSIGN_AZURE_STORAGE_URL: https://opendalci.blob.core.windows.net/reqsign-live-test/probe.txt
